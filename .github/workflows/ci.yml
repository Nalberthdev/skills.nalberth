name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Valida skills e CLI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Valida o formato das skills
        run: node bin/cli.js validate

      - name: Confere que os comandos respondem
        run: |
          node bin/cli.js --version
          node bin/cli.js list
          node bin/cli.js targets

      - name: Instala em todos os alvos num diretório descartável
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          for target in claude cursor windsurf copilot agents gemini print; do
            echo "--- $target"
            HOME=/tmp/smoke node "$GITHUB_WORKSPACE/bin/cli.js" add --all --target "$target"
          done

      - name: Confere que reinstalar não duplica
        run: |
          cd /tmp/smoke
          HOME=/tmp/smoke node "$GITHUB_WORKSPACE/bin/cli.js" add --all --target agents
          blocos=$(grep -c '^<!-- nalberth-skills:[^/]' AGENTS.md)
          skills=$(find "$GITHUB_WORKSPACE/skills" -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "blocos=$blocos skills=$skills"
          test "$blocos" -eq "$skills"
